title: "Generative AI & ML Fundamentals — Mid-Term (Sample)"
instructions: >
  Award marks for correct ideas expressed in any wording. Do not deduct for spelling or grammar.
  For numerical questions, award method marks even if the final value is wrong (carry-forward errors
  are not penalised twice).
questions:
  - id: "1"
    text: "Define overfitting. Give two techniques used to reduce it and explain briefly how each one helps."
    max_marks: 4
    rubric:
      - id: "1.1"
        description: "Defines overfitting: the model fits the training data (including noise) too closely, so it performs well on training data but poorly on unseen/test data."
        marks: 2
      - id: "1.2"
        description: "Names a valid technique (e.g. regularisation, dropout, early stopping, more data/augmentation, simpler model, cross-validation) and explains how it helps."
        marks: 1
      - id: "1.3"
        description: "Names a second, different valid technique and explains how it helps."
        marks: 1
    model_answer: >
      Overfitting is when a model learns the training data too closely, including its noise, so it has low
      training error but high error on new data (poor generalisation). Two remedies: (1) L2 regularisation
      adds a penalty on large weights, pushing the model towards simpler functions; (2) early stopping
      halts training when validation loss starts increasing, before the model memorises the training set.

  - id: "2"
    text: "Explain how scaled dot-product self-attention works in a Transformer. Your answer should cover queries, keys and values, how attention weights are computed, and why the scores are scaled."
    max_marks: 6
    rubric:
      - id: "2.1"
        description: "Explains that each token is projected into query, key and value vectors using learned weight matrices."
        marks: 1.5
      - id: "2.2"
        description: "Attention scores are dot products of a token's query with all keys (QK^T)."
        marks: 1
      - id: "2.3"
        description: "Scores are normalised with softmax to give attention weights that sum to 1."
        marks: 1
      - id: "2.4"
        description: "Output for each token is the attention-weighted sum of the value vectors."
        marks: 1
      - id: "2.5"
        description: "Explains scaling by sqrt(d_k): large dot products in high dimensions push softmax into saturated regions with tiny gradients; scaling keeps the variance stable."
        marks: 1.5
    model_answer: >
      Each input token embedding x is multiplied by learned matrices W_Q, W_K, W_V to give a query q, key k and
      value v. The score between token i and token j is q_i·k_j, computed for all pairs as QK^T. Scores are
      divided by sqrt(d_k) and passed through a softmax over j, giving weights that are positive and sum to 1.
      The output for token i is the weighted sum of all value vectors: Attention(Q,K,V)=softmax(QK^T/sqrt(d_k))V.
      Scaling is needed because the dot product of two d_k-dimensional vectors has variance proportional to d_k;
      large scores make the softmax very peaked (saturated), so gradients become extremely small and training
      becomes unstable.

  - id: "3"
    text: "A spam classifier is evaluated on 100 emails. Results: TP = 40, FP = 10, FN = 20, TN = 30. Compute the precision, recall, F1-score and accuracy. Show your working."
    max_marks: 5
    rubric:
      - id: "3.1"
        description: "Precision = TP/(TP+FP) = 40/50 = 0.8 (formula with correct substitution)."
        marks: 1
      - id: "3.2"
        description: "Recall = TP/(TP+FN) = 40/60 ≈ 0.667."
        marks: 1
      - id: "3.3"
        description: "F1 = 2PR/(P+R) correctly applied ≈ 0.727 (accept carry-forward from the student's own P and R)."
        marks: 2
      - id: "3.4"
        description: "Accuracy = (TP+TN)/total = 70/100 = 0.7."
        marks: 1
    model_answer: >
      Precision = 40/(40+10) = 0.80. Recall = 40/(40+20) = 0.667. F1 = 2×0.8×0.667/(0.8+0.667) = 1.067/1.467
      ≈ 0.727. Accuracy = (40+30)/100 = 0.70.

  - id: "4"
    text: "Compare Generative Adversarial Networks (GANs) and diffusion models in terms of (a) how they are trained, (b) training stability, (c) sample diversity, and (d) generation speed."
    max_marks: 7
    rubric:
      - id: "4.1"
        description: "GAN training: a generator and discriminator are trained adversarially (minimax game); generator tries to fool the discriminator."
        marks: 1.5
      - id: "4.2"
        description: "Diffusion training: data is gradually corrupted with Gaussian noise (forward process) and a network learns to reverse it / predict the noise (denoising objective)."
        marks: 1.5
      - id: "4.3"
        description: "Stability: GAN training is unstable/hard to balance; diffusion training is stable (simple regression-style loss)."
        marks: 1.5
      - id: "4.4"
        description: "Diversity: GANs can suffer mode collapse (low diversity); diffusion models cover the data distribution better / more diverse samples."
        marks: 1.5
      - id: "4.5"
        description: "Speed: GANs generate in a single forward pass (fast); diffusion needs many iterative denoising steps (slow), though distillation/fewer-step samplers help."
        marks: 1
    model_answer: >
      (a) A GAN trains a generator G and a discriminator D in a minimax game: D learns to tell real from fake,
      G learns to produce samples that fool D. A diffusion model defines a forward process that adds Gaussian
      noise over many steps and trains a network to predict the noise (i.e. denoise) at each step.
      (b) GAN training is notoriously unstable — the two networks must stay balanced and training can diverge
      or oscillate. Diffusion training is stable because it minimises a simple mean-squared error.
      (c) GANs often suffer from mode collapse, producing limited variety. Diffusion models cover the
      distribution better and give more diverse samples. (d) GANs produce a sample in one forward pass, so they
      are fast; diffusion models need tens to thousands of denoising steps, so sampling is slower (mitigated
      by DDIM, distillation or consistency models).

  - id: "5"
    text: "Describe the Retrieval-Augmented Generation (RAG) pipeline. Then identify two ways a RAG system can fail and propose a mitigation for each."
    max_marks: 8
    rubric:
      - id: "5.1"
        description: "Indexing: documents are split into chunks, embedded, and stored in a vector index/database."
        marks: 1.5
      - id: "5.2"
        description: "Retrieval: the query is embedded and the most similar chunks are retrieved (similarity search, top-k)."
        marks: 1.5
      - id: "5.3"
        description: "Generation: retrieved chunks are inserted into the LLM prompt as context and the LLM generates an answer grounded in them."
        marks: 1
      - id: "5.4"
        description: "First valid failure mode clearly identified with a specific, appropriate mitigation (e.g. irrelevant/missed retrieval → hybrid search, re-ranking, better chunking)."
        marks: 2
      - id: "5.5"
        description: "Second, different valid failure mode with a specific, appropriate mitigation (e.g. model ignores context or hallucinates → instruct to cite sources/abstain, faithfulness checks; stale index → re-indexing)."
        marks: 2
    model_answer: >
      Offline, documents are split into chunks, each chunk is converted to an embedding vector and stored in a
      vector database. At query time the user question is embedded, the top-k most similar chunks are
      retrieved, and they are inserted into the prompt so the LLM answers using that context.
      Failure 1: retrieval misses the relevant passage (poor chunking, vocabulary mismatch) — mitigate with
      hybrid BM25 + dense search and a cross-encoder re-ranker. Failure 2: the LLM hallucinates or ignores the
      retrieved context — mitigate by instructing it to answer only from context and cite chunks, abstain when
      evidence is missing, and run a faithfulness check on the output.
